<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jamie's Auto Care</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .status-confirmed {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .status-completed {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-950 text-white py-4 px-6 flex justify-between items-center">
        <div class="font-bold text-xl">Jamie's Auto Care - Admin</div>
        <div class="flex items-center space-x-4">
            <a href="/" class="text-sm text-gray-300 hover:text-white">
                View Website
            </a>
            <a href="/admin/logout.html" class="flex items-center text-sm text-gray-300 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout
            </a>
        </div>
    </header>

    <div class="flex min-h-[calc(100vh-64px)]">
        <aside class="w-64 bg-white border-r border-gray-200 p-4">
            <nav class="space-y-2">
                <a href="/admin/bookings.html" class="block px-4 py-2 rounded bg-gray-100 text-blue-900 font-medium">
                    Bookings
                </a>
                <a href="/admin/settings.html" class="block px-4 py-2 rounded hover:bg-gray-100">
                    Settings
                </a>
            </nav>
        </aside>

        <main class="flex-1 p-6">
            <div class="space-y-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold">Booking Requests</h1>
                    <div class="flex items-center space-x-4">
                        <select id="status-filter" class="border border-gray-300 rounded-md px-3 py-1">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="confirmed">Confirmed</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                        <button id="refresh-button" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-xl font-bold mb-4">All Bookings</h2>
                    
                    <div id="loading-indicator" class="flex justify-center items-center py-8">
                        <div class="spinner"></div>
                        <span class="ml-2">Loading bookings...</span>
                    </div>
                    
                    <div id="bookings-container" class="overflow-x-auto"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/booking-api.js"></script>
    <script src="/js/admin-bookings.js"></script>
</body>
</html>
