<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Jamie's Auto Care</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="w-full max-w-md p-8 space-y-8 bg-white rounded-lg shadow">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-blue-900">Admin Login</h1>
                <p class="mt-2 text-gray-600">Enter your password to access the admin dashboard</p>
            </div>

            <div id="error-message" class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-md hidden"></div>

            <form id="admin-login-form" class="space-y-6">
                <div class="space-y-2">
                    <label for="password" class="block font-medium">Password</label>
                    <input
                        id="password"
                        type="password"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                </div>

                <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2 px-4 rounded">
                    Login
                </button>
            </form>
        </div>
    </div>

    <script src="/js/admin-login.js"></script>
</body>
</html>
