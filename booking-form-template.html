<!-- This is a template for how to structure your booking form in the static HTML -->
<form id="booking-form" class="booking-form">
  <div id="form-status"></div>
  
  <div class="form-row">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>
    
    <div class="form-group">
      <label for="vehicle">Vehicle Make/Model</label>
      <input type="text" id="vehicle" name="vehicle" required>
    </div>
  </div>
  
  <div class="form-group">
    <label for="issue">Issue Description</label>
    <textarea id="issue" name="issue" rows="4" required></textarea>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label for="date">Preferred Date</label>
      <input type="date" id="date" name="date" required>
    </div>
    
    <div class="form-group">
      <label for="timeSlot">Preferred Time</label>
      <select id="timeSlot" name="timeSlot" required>
        <option value="">Select time slot</option>
        <option value="Morning (09:30 - 12:30)">Morning (09:30 - 12:30)</option>
        <option value="Afternoon (13:30 - 17:30)">Afternoon (13:30 - 17:30)</option>
        <option value="Weekend Sat/Sun (10:30 - 13:30)">Weekend Sat/Sun (10:30 - 13:30)</option>
      </select>
    </div>
  </div>
  
  <button type="submit" class="submit-button">Submit Booking Request</button>
</form>

<!-- Add this script tag to your HTML -->
<script src="/js/booking-form-static.js"></script>
